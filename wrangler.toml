name = "nomina-construacero"
main = "./worker.js"
compatibility_date = "2024-12-01"
workers_dev = true

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NOMINA_TIMEZONE = "America/Caracas"
# Lista separada por comas. En local usa .dev.vars; en producción define solo
# los dominios HTTPS definitivos como secreto/variable del entorno.
NOMINA_ALLOWED_ORIGINS = ""
