name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      # Verification requires no production credentials or networked database.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify project, guards, tests, and fresh production bundle
        run: npm run verify
